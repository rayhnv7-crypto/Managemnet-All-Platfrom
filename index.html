function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setPage(p){page=p;activeTab='Semua';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('crumb').textContent=({overview:'Overview',connections:'Connections',campaigns:'Ads',content:'Posts',analytics:'Analytics',income:'Income',api:'API Keys',inbox:'Inbox',ads:'Ads',commerce:'Commerce',creators:'Creators',accounts:'Accounts',library:'Content Library',schedules:'Schedules',tasks:'Tasks',webhooks:'Webhooks',users:'Users',settings:'Settings'})[p]||p;document.getElementById('sidebar').classList.remove('open');render()}

function empty(title,desc){return `<div class="empty"><b>${title}</b>${desc}</div>`}

function getApiAdminSecret(){return sessionStorage.getItem('clipper-admin-secret')||''}
async function apiAdminRequest(method='GET',body=null,idValue=''){
 const secret=getApiAdminSecret();if(!secret)throw new Error('Admin Secret belum dimasukkan.');
 const url='/api/keys'+(idValue?'?id='+encodeURIComponent(idValue):'');
 const r=await fetch(url,{method,headers:{'x-admin-secret':secret,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});
 const data=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(data.error||('HTTP '+r.status));
 return data;
}
async function apiPage(v){
 const secret=getApiAdminSecret();
 if(!secret){
  v.innerHTML=pageHead('API Keys','Pengelolaan API Key tersimpan dan divalidasi di backend CLIPPER HUB')
  +'<section class="card"><h3 class="section-title">Admin authentication</h3><p class="muted" style="font-size:12px">Masukkan Admin Secret untuk membuka pengelolaan API Key. Secret hanya disimpan di session browser ini dan tidak masuk ke localStorage.</p><div class="form-field"><label>CLIPPER ADMIN SECRET</label><input id="api-admin-secret" type="password" autocomplete="current-password" placeholder="Masukkan Admin Secret"></div><div class="modal-actions"><button class="btn primary" onclick="saveApiAdminSecret()">Buka API Keys</button></div><p id="api-admin-error" class="muted" style="font-size:11px"></p></section>';
  return;
 }
 v.innerHTML=pageHead('API Keys','Kunci akses dibuat dan disimpan hash-nya di Supabase backend')
 +'<section class="card"><p class="muted">Memuat API Keys dari backend...</p></section>';
 try{
  const data=await apiAdminRequest('GET');const keys=data.keys||[];const active=keys.filter(k=>!k.revoked_at).length;
  v.innerHTML=pageHead('API Keys','Kunci akses dibuat dan disimpan hash-nya di Supabase backend',`<div class="actions"><button class="btn" onclick="clearApiAdminSecret()">Lock</button><button class="btn primary" onclick="createApiKey()">＋ Generate API Key</button></div>`)
  +'<div class="notice green">Backend aktif. Secret API Key hanya ditampilkan satu kali; database hanya menyimpan hash.</div>'
  +'<div class="grid stats">'+stat('Total API Key',num(keys.length),'Tercatat di Supabase')+stat('Key aktif',num(active),'Belum dicabut')+stat('Key dicabut',num(keys.length-active),'Akses dinonaktifkan')+stat('Jenis akses','2','Read-only / Read-write')+'</div>'
  +'<section class="card"><div class="row between"><h3 class="section-title">Daftar API Key</h3><span class="muted" style="font-size:11px">Secret tidak dapat ditampilkan ulang</span></div>'
  +(keys.length?'<div class="table-wrap"><table><thead><tr><th>Nama</th><th>Prefix</th><th>Izin</th><th>Dibuat</th><th>Terakhir digunakan</th><th>Status</th><th>Aksi</th></tr></thead><tbody>'+keys.map(k=>'<tr><td><b>'+esc(k.name)+'</b></td><td><code>'+esc(k.key_prefix)+'••••</code></td><td>'+esc(k.permissions)+'</td><td>'+esc(k.created_at||'—')+'</td><td>'+esc(k.last_used_at||'Belum digunakan')+'</td><td>'+status(k.revoked_at?'Dicabut':'Aktif')+'</td><td>'+(k.revoked_at?'—':'<button class="btn small danger" onclick="revokeApiKey(\''+k.id+'\')">Cabut akses</button>')+'</td></tr>').join('')+'</tbody></table></div>':empty('Belum ada API Key','Klik Generate API Key untuk membuat key pertama.'))+'</section>'
  +'<section class="card" style="margin-top:14px"><h3 class="section-title">Contoh penggunaan</h3><pre style="white-space:pre-wrap;color:#b8e4c8;font-size:11px;line-height:1.6">Authorization: Bearer YOUR_API_KEY</pre><p class="muted" style="font-size:11px;margin-bottom:0">Jangan pernah menaruh secret API Key di kode frontend atau GitHub.</p></section>';
 }catch(e){
  if(String(e.message).includes('Admin authentication'))sessionStorage.removeItem('clipper-admin-secret');
  v.innerHTML=pageHead('API Keys','Akses backend belum berhasil')+'<section class="card"><div class="notice">'+esc(e.message)+'</div><button class="btn" onclick="clearApiAdminSecret()">Masukkan ulang Admin Secret</button></section>';
 }
}
function saveApiAdminSecret(){
 const value=document.getElementById('api-admin-secret')?.value||'';
 if(!value.trim()){document.getElementById('api-admin-error').textContent='Admin Secret wajib diisi.';return}
 sessionStorage.setItem('clipper-admin-secret',value.trim());apiPage(document.getElementById('view'));
}
function clearApiAdminSecret(){sessionStorage.removeItem('clipper-admin-secret');apiPage(document.getElementById('view'))}
async function createApiKey(){
 const name=prompt('Nama API Key (contoh: Integrasi Dashboard):');if(!name||!name.trim())return;
 const permissions=confirm('Pilih OK untuk READ-WRITE (baca + ubah data). Pilih Cancel untuk READ-ONLY (hanya baca).')?'read-write':'read-only';
 try{
  const data=await apiAdminRequest('POST',{name:name.trim(),permissions});
  const secret=data.key;
  const backdrop=document.createElement('div');backdrop.className='modal-backdrop show';
  backdrop.innerHTML='<div class="modal"><h2>API Key berhasil dibuat</h2><div class="notice">Salin sekarang. Secret hanya ditampilkan sekali; backend hanya menyimpan hash.</div><div class="form-field"><label>API KEY — SIMPAN DI TEMPAT AMAN</label><input id="new-api-secret" readonly value="'+esc(secret)+'" style="width:100%;background:#0b1112;border:1px solid var(--line);border-radius:8px;padding:12px;color:var(--green)"></div><div class="modal-actions"><button class="btn" id="copy-api">Salin API Key</button><button class="btn primary" id="close-api">Selesai</button></div></div>';
  document.body.appendChild(backdrop);backdrop.querySelector('#copy-api').onclick=async()=>{try{await navigator.clipboard.writeText(secret);backdrop.querySelector('#copy-api').textContent='Tersalin'}catch{document.getElementById('new-api-secret').select();document.execCommand('copy');backdrop.querySelector('#copy-api').textContent='Tersalin'}};backdrop.querySelector('#close-api').onclick=()=>{backdrop.remove();apiPage(document.getElementById('view'))};
 }catch(e){alert('Gagal membuat API Key: '+e.message)}
}
async function revokeApiKey(kid){
 if(!confirm('Cabut API Key ini? Semua request berikutnya dengan key tersebut akan ditolak.'))return;
 try{await apiAdminRequest('DELETE',null,kid);await apiPage(document.getElementById('view'))}catch(e){alert('Gagal mencabut API Key: '+e.message)}
}

}
const providers=[
['TikTok','♪'],['Instagram','◎'],['YouTube','▶'],['Facebook','f'],['Twitter / X','𝕏'],
['Discord','◉'],['Telegram','➤'],['WhatsApp','◉'],['Google account','G'],['Google Analytics','▥'],
['Google Ads','△'],['Google Business','▣'],['HubSpot','◉'],['Mailchimp','M'],['Shopify','S'],
['Notion','▤'],['Airtable','▦'],['Slack','#'],['Stripe','$'],['OpenAI','✳'],
['LinkedIn','in'],['Pinterest','P'],['Reddit','r'],['Microsoft account','⊞'],['Custom API','</>']
];
const providerGroups={Social:['TikTok','Instagram','Facebook','YouTube','LinkedIn','Google Business','Snapchat'],Blogs:['Shopify','WordPress','Wix'],Communication:['Telegram','Discord','WhatsApp','iMessage','HubSpot'],Productivity:['Google account'],Analytics:['Google Analytics'],Ads:['Meta Ads','LinkedIn Ads','Pinterest Ads','TikTok Ads','Google Ads','X Ads','OpenAI Ads','Reddit Ads']};
const providerRoute={
 'TikTok':'tiktok','TikTok Ads':'tiktok','Instagram':'meta','Facebook':'meta','Facebook Ads':'meta','Meta Ads':'meta','YouTube':'google','Google account':'google','Google Analytics':'google','Google Ads':'google','LinkedIn':'linkedin','LinkedIn Ads':'linkedin','Twitter / X':'x'
};
let liveProviderState={};
async function loadProviderState(){
 try{const r=await fetch('/api/providers',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();liveProviderState=Object.fromEntries((d.providers||[]).map(x=>[x.id,x]));return true}
 catch(e){liveProviderState={};return false}
}
async function startOfficialConnect(name){
 const route=providerRoute[name];
 if(!route){alert(`${name} belum memiliki konektor OAuth aktif di backend. Tidak ada URL atau status palsu yang akan digunakan.`);return}
 try{
  const r=await fetch(`/api/oauth/start/${route}`,{redirect:'manual',cache:'no-store'});
  if(r.status===409){const d=await r.json();alert(d.error||'Kredensial provider belum disiapkan di server.');return}
  if(r.status===404){alert('Konektor belum tersedia di backend.');return}
  if(r.status>=500)throw new Error('Backend gagal memulai OAuth. Periksa Logs server.');
  if(r.type==='opaqueredirect'||r.status===0){window.location.href=`/api/oauth/start/${route}`;return}
  if(r.status>=300&&r.status<400){window.location.href=`/api/oauth/start/${route}`;return}
  const d=await r.json().catch(()=>({}));if(d.error)throw new Error(d.error);
  window.location.href=`/api/oauth/start/${route}`;
 }catch(e){alert(`Koneksi backend gagal: ${e.message}`)}
}

 <section class="card ch-connections"><div class="ch-connect-head"><div class="row"><div class="integration-icon ch-tiktok-icon">♪</div><div><h2>TikTok</h2><p>5 slot akun khusus · connect satu per satu</p></div></div><span class="status">${connected?'1/5 Terhubung':'0/5 Terhubung'}</span></div>
 <div class="ch-slot-grid">${Array.from({length:5},(_,i)=>`<article class="ch-slot"><div class="ch-slot-top"><b>Akun ${i+1}</b><span>Slot 0${i+1}</span></div><div class="ch-slot-avatar">♙</div><p>${configured?'Belum terhubung':'Credential belum disetel'}</p><button class="btn ${configured?'primary':''}" onclick="startOfficialConnect('TikTok')">Connect TikTok</button></article>`).join('')}</div></section>
 <section class="card ch-info"><span class="ch-info-mark">i</span><div><b>Informasi koneksi</b><p>Saat ini TikTok menjadi satu-satunya platform yang ditampilkan di halaman Connections. Integrasi platform lain dapat ditambahkan kemudian.</p></div></section>`;
}

 overlay.innerHTML=`<div style="width:min(440px,100%);height:100%;overflow:auto;background:#10171c;border-left:1px solid #34434d;padding:22px"><div class="row between"><div><h2 style="margin:0">New Connection</h2><p class="muted" style="font-size:12px">Pilih platform yang ingin dihubungkan</p></div><button class="btn" onclick="document.getElementById('connection-drawer').remove()">✕</button></div>${groups}</div>`;

function editLeadForm(fid){let f=db.leadForms.find(x=>x.id===fid);leadFormModal(f,true)}
function leadFormModal(f,editingForm){
 openModal(editingForm?'Edit Lead Form':'Create Lead Form',[{name:'name',label:'Form Name',required:true,full:true},{name:'questionsText',label:'Questions (satu pertanyaan per baris)',type:'textarea',full:true,value:(f.questions||[]).join('\n')},{name:'privacyUrl',label:'Privacy Policy URL',full:true},{name:'thankYou',label:'Thank You Message',type:'textarea',full:true}],{...f,questionsText:(f.questions||[]).join('\n')},d=>{f.name=d.name;f.questions=d.questionsText.split('\n').map(q=>q.trim()).filter(Boolean);f.privacyUrl=d.privacyUrl;f.thankYou=d.thankYou;f.createdAt=f.createdAt||new Date().toLocaleDateString('id-ID');if(!editingForm)db.leadForms.push(f);addLog(editingForm?'Lead form updated':'Lead form created',f.name,'Info')});

function logsPage(v){
 const rows=db.logs||[];v.innerHTML=pageHead('Logs','Riwayat aktivitas dan kejadian sistem CLIPPER HUB',`<button class="btn" onclick="render()">↻ Refresh</button><button class="btn" onclick="exportLogs()">↓ Export</button>`)+`<div class="toolbar"><input class="field" placeholder="Search logs..." oninput="filterTable('logs-table',this.value)"><select class="select" onchange="filterByStatus('logs-table',this.value)"><option value="">All levels</option><option>Info</option><option>Warning</option><option>Error</option></select><span class="pill">${rows.length} events</span></div><div class="table-wrap"><table id="logs-table"><thead><tr><th>Timestamp</th><th>Level</th><th>Action</th><th>Details</th></tr></thead><tbody>${rows.map(l=>`<tr data-search="${esc((l.action+' '+l.detail+' '+l.level).toLowerCase())}" data-status="${esc(l.level)}"><td>${new Date(l.time).toLocaleString('id-ID')}</td><td>${status(l.level)}</td><td>${esc(l.action)}</td><td>${esc(l.detail||'—')}</td></tr>`).join('')}</tbody></table>${!rows.length?empty('No logs yet','Aktivitas yang dicatat CLIPPER HUB akan muncul di sini.'):''}</div>`;

function importAnalyticsCSV(input){
 const file=input.files?.[0];if(!file)return;
 const reader=new FileReader();reader.onload=()=>{try{
 const lines=String(reader.result).replace(/^\\uFEFF/,'').split(/\\r?\\n/).filter(Boolean);
 const split=line=>{let out=[],cur='',q=false;for(let i=0;i<line.length;i++){let ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===','&&!q){out.push(cur.trim());cur=''}else cur+=ch}out.push(cur.trim());return out};
 const headers=split(lines[0]).map(x=>x.toLowerCase().replace(/[\\s-]+/g,'_'));
 const aliases={date:['date','day','tanggal','publish_date'],platform:['platform','social_network','network'],account:['account','account_name','username','channel'],content:['content','video','post','title','content_title'],views:['views','view','video_views','plays','impressions'],likes:['likes','like'],comments:['comments','comment'],shares:['shares','share'],followers:['followers','follower','subscribers']};
 const map={};Object.entries(aliases).forEach(([k,a])=>map[k]=headers.findIndex(h=>a.includes(h)));
 const imported=lines.slice(1).map(line=>{const a=split(line),o={};Object.entries(map).forEach(([k,i])=>{if(i>=0)o[k]=k==='date'||k==='platform'||k==='account'||k==='content'?a[i]:Number(String(a[i]||'0').replace(/[^0-9.-]/g,''))||0});return o}).filter(o=>Object.keys(o).length>1);
 if(!imported.length)throw new Error('Kolom CSV tidak dikenali. Gunakan date, platform, account, content, views, likes, comments, shares, followers.');
 if(!getApiAdminSecret())throw new Error('Unlock Admin Secret dahulu melalui menu API Keys agar import tersimpan ke Supabase.');fetch('/api/analytics',{method:'POST',headers:{'Content-Type':'application/json','x-admin-secret':getApiAdminSecret()},body:JSON.stringify({rows:imported})}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||'Supabase import gagal');analyticsLoaded=false;db.analyticsImports=[...(db.analyticsImports||[]),{file:file.name,rows:d.inserted,at:new Date().toISOString()}];addLog('Analytics CSV synced to Supabase',file.name+' · '+d.inserted+' rows');save();alert('Import tersimpan di Supabase: '+d.inserted+' baris.');}).catch(e=>alert('Import gagal: '+e.message));
 }catch(e){alert('Import gagal: '+e.message)}input.value='';};reader.readAsText(file);
}

const SEO_KEY='clipper-seo-v1';

function seoSave(d){localStorage.setItem(SEO_KEY,JSON.stringify(d))}

async function seoLoadRemote(kind){try{const j=await seoAPI(kind);return j.data||[]}catch(e){console.warn('SEO API '+kind+':',e.message);return null}}
async function seoSyncSites(){const rows=await seoLoadRemote('sites');if(rows){const d=seoDB();d.sites=rows.map(x=>({...x,domain:x.domain||x.url,created:x.created||x.created_at||''}));seoSave(d);render()}}

 }else if(page==='seo-ranks'||page==='seo-performance'){
 body='<div class="toolbar"><button class="btn" onclick="seoGscConnect()">Hubungkan Google Search Console</button><select id="gscProperty" class="field"></select><input id="gscStart" type="date" class="field"><input id="gscEnd" type="date" class="field"><button class="btn primary" onclick="seoGscLoad()">Ambil data GSC</button></div><div id="gscResults">'+(d.ranks?.length?table(['Query','Clicks','Impressions','CTR','Position'],d.ranks.map(x=>'<tr><td>'+esc(x.query||x.keyword||'')+'</td><td>'+x.clicks+'</td><td>'+x.impressions+'</td><td>'+Number(x.ctr||0).toFixed(2)+'%</td><td>'+Number(x.position||0).toFixed(1)+'</td></tr>').join('')):empty('Belum ada data GSC')+'</div>';
 }else if(page==='seo-ai'){
 body='<div class="notice">AI memakai OpenRouter API melalui backend. API key hanya disimpan di Vercel Environment Variables, tidak di browser. Isi owner secret pada Settings AI agar request terautentikasi.</div><label>Owner Secret</label><input type="password" class="field" id="seoAiSecret" placeholder="CLIPPER_ADMIN_SECRET"><section class="card"><h3 class="section-title">AI SEO Workspace</h3><label>Mode</label><select id="seoAiMode" class="field"><option value="keyword">Keyword strategy</option><option value="article">Article brief / draft</option><option value="audit">SEO content audit</option><option value="competitor">Competitor analysis framework</option><option value="seo">General SEO</option></select><label>Website</label><input id="seoAiSite" class="field" placeholder="https://domain.com"><label>Target keyword</label><input id="seoAiKeyword" class="field" placeholder="keyword utama"><label>Prompt</label><textarea class="field" id="seoPrompt" style="width:100%;min-height:140px" placeholder="Instruksi AI SEO..."></textarea><button class="btn primary" onclick="seoRunAI()">Run AI</button><div id="seoAiOutput" class="card" style="margin-top:14px;white-space:pre-wrap">Output AI akan tampil di sini.</div></section>';
 }else{
 body='<div class="toolbar">'+btn('Buat workflow','alert(\'Workflow automation memerlukan scheduler backend.\')')+'</div><div class="notice">Automation belum aktif. Jadwal harus diproses server-side agar tetap berjalan ketika browser ditutup.</div>'+empty('Workflow belum dibuat');
 }
 v.innerHTML=head+body;
}
function seoForm(title,fields,callback){const d=seoDB();let html='<div class="form-grid">'+fields.map(f=>'<div class="form-field '+(f.full?'full':'')+'"><label>'+f.label+'</label><input id="sf_'+f.name+'" placeholder="'+(f.placeholder||'')+'" '+(f.required?'required':'')+'></div>').join('')+'</div>';openModal(title,fields.map(f=>({name:f.name,label:f.label,required:f.required,full:f.full,placeholder:f.placeholder})),{},callback)}
function seoAddSite(){openModal('Tambah Website',[{name:'domain',label:'Domain (https://...)',required:true,full:true},{name:'category',label:'Kategori / niche'},{name:'status',label:'Status',value:'Active'}],{},async x=>{let d=seoDB();try{const j=await seoAPI('sites','POST',{domain:x.domain,category:x.category,status:x.status||'Active'});d.sites.unshift({...j.data,created:j.data.created_at||new Date().toLocaleDateString('id-ID')});}catch(e){alert('Simpan ke server gagal: '+e.message+'\nData tidak disimpan lokal agar tidak terjadi data palsu.');return}seoSave(d);render()})}
async function seoAddLP(){openModal('Tambah Landing Page',[{name:'name',label:'Nama LP',required:true},{name:'url',label:'URL LP',required:true,full:true},{name:'site',label:'Domain website'},{name:'keyword',label:'Target keyword'},{name:'status',label:'Status',value:'Draft'}],{},async x=>{try{const site_id=x.site?await seoSiteId(x.site):null;const j=await seoAPI('pages','POST',{name:x.name,url:x.url,site_id,target_keyword:x.keyword,status:x.status||'draft'});await seoRefresh('pages')}catch(e){alert('LP gagal disimpan: '+e.message)}}) }
async function seoAddKeyword(){openModal('Tambah Keyword',[{name:'word',label:'Keyword',required:true,full:true},{name:'site',label:'Website target'},{name:'intent',label:'Search intent'},{name:'target',label:'Target URL'}],{},async x=>{try{const site_id=x.site?await seoSiteId(x.site):null;await seoAPI('keywords','POST',{keyword:x.word,site_id,intent:x.intent,target_url:x.target,status:'research_pending'});await seoRefresh('keywords')}catch(e){alert('Simpan keyword ke server gagal: '+e.message)}})}
async function seoAddCompetitor(){openModal('Tambah Kompetitor',[{name:'domain',label:'Domain kompetitor',required:true,full:true},{name:'keyword',label:'Keyword pembanding'},{name:'note',label:'Catatan'}],{},async x=>{try{const j=await seoAPI('competitors','POST',{domain:x.domain,keyword:x.keyword,notes:x.note});await seoRefresh('competitors')}catch(e){alert('Kompetitor gagal disimpan: '+e.message)}})}
async function seoAddArticle(){openModal('Draft Artikel SEO',[{name:'title',label:'Judul artikel',required:true,full:true},{name:'keyword',label:'Target keyword'},{name:'site',label:'Website'},{name:'body',label:'Brief / draft',type:'textarea',full:true},{name:'status',label:'Status',value:'Draft'}],{},async x=>{try{const site_id=x.site?await seoSiteId(x.site):null;await seoAPI('articles','POST',{title:x.title,keyword:x.keyword,site_id,content:x.body,status:x.status||'draft'});await seoRefresh('articles')}catch(e){alert('Artikel gagal disimpan: '+e.message)}})}
function seoViewArticle(id){const x=seoDB().articles.find(a=>a.id===id);if(x)openModal('Artikel: '+x.title,[{name:'body',label:'Isi / brief',full:true}],{},()=>{});if(x)alert(x.title+'\n\n'+(x.body||'Draft kosong'))}
async function seoDelete(key,id){if(!confirm('Hapus record ini?'))return;let kind={sites:'sites',lps:'pages',keywords:'keywords',competitors:'competitors',articles:'articles'}[key];if(!kind)return;try{await seoAPI(kind,'DELETE',{},id);await seoRefresh(kind)}catch(e){alert('Hapus server gagal: '+e.message)}}
async function seoAuditRun(){const url=document.getElementById('seoAuditUrl').value.trim();if(!/^https?:\/\//i.test(url)){alert('Masukkan URL lengkap http:// atau https://');return}try{const sites=await seoAPI('sites');const host=new URL(url).hostname;const site=(sites.data||[]).find(s=>{try{return new URL(/^https?:\/\//i.test(s.domain)?s.domain:'https://'+s.domain).hostname===host}catch{return false}});if(!site){alert('Domain belum terdaftar di Websites. Tambahkan dahulu.');return}const result=await seoAPI('crawl','POST',{site_id:site.id,start_url:url,max_pages:50});alert('Crawl selesai. Halaman: '+result.pages+' | Issues: '+result.issues+' | Run: '+result.run_id);await seoRefresh('audits')}catch(e){alert('Crawl gagal: '+e.message)}}
function seoExport(){const blob=new Blob([JSON.stringify(seoDB(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='clipper-seo-data.json';a.click();URL.revokeObjectURL(a.href)}

async function seoGscConnect(){try{const r=await fetch('/api/seo/google?action=connect',{method:'POST',headers:{'x-clipper-secret':seoSecret()}}),j=await r.json();if(!r.ok)throw Error(j.error||'OAuth connect failed');location.href=j.url}catch(e){alert('GSC connect gagal: '+e.message)}}async function seoGscLoad(){const prop=document.getElementById('gscProperty')?.value;if(!prop)return alert('Pilih property GSC');const start=document.getElementById('gscStart').value,end=document.getElementById('gscEnd').value;try{const r=await fetch('/api/seo/google?action=search',{method:'POST',headers:{'Content-Type':'application/json','x-clipper-secret':seoSecret()},body:JSON.stringify({siteUrl:prop,startDate:start,endDate:end,dimensions:['query'],rowLimit:250})});const j=await r.json();if(!r.ok)throw Error(j.error||j.detail);const d=seoDB();d.ranks=(j.rows||[]).map(x=>({query:x.keys?.[0],clicks:x.clicks,impressions:x.impressions,ctr:x.ctr*100,position:x.position}));seoSave(d);document.getElementById('gscResults').innerHTML='<div class="table-wrap"><table><thead><tr><th>Query</th><th>Clicks</th><th>Impressions</th><th>CTR</th><th>Position</th></tr></thead><tbody>'+d.ranks.map(x=>'<tr><td>'+esc(x.query)+'</td><td>'+x.clicks+'</td><td>'+x.impressions+'</td><td>'+x.ctr.toFixed(2)+'%</td><td>'+x.position.toFixed(1)+'</td></tr>').join('')+'</tbody></table></div>'}catch(e){alert('GSC gagal: '+e.message)}}async function seoGscProperties(){try{const r=await fetch('/api/seo/google?action=properties',{headers:{'x-clipper-secret':seoSecret()}}),j=await r.json();if(!r.ok)throw Error(j.error);const el=document.getElementById('gscProperty');el.innerHTML=(j.properties||[]).map(x=>'<option value="'+esc(x.siteUrl)+'">'+esc(x.siteUrl)+'</option>').join('')}catch(e){console.warn(e.message)}}async function seoRunAI(){const out=document.getElementById('seoAiOutput'),prompt=document.getElementById('seoPrompt')?.value||'';out.textContent='AI sedang memproses...';try{const r=await fetch('/api/seo/ai',{method:'POST',headers:{'Content-Type':'application/json','x-clipper-secret':document.getElementById('seoAiSecret')?.value||''},body:JSON.stringify({prompt,site:document.getElementById('seoAiSite')?.value,keyword:document.getElementById('seoAiKeyword')?.value,mode:document.getElementById('seoAiMode')?.value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Request gagal');out.textContent=d.output||'Tidak ada output';}catch(e){out.textContent='ERROR: '+e.message;}}
</script>
