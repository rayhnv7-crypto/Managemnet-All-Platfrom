name: CLIPPER HUB checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: |
          set -o pipefail
          find . -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) -not -path './node_modules/*' -not -path './.git/*' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file" || exit 1
          done
      - name: Run test suite
        run: npm test
      - name: Validate HTML structure
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('index.html','utf8');
          const opens = html.split('<script').length - 1;
          const closes = html.split('</script>').length - 1;
          if (opens !== closes) throw new Error(`script tags mismatch: ${opens}/${closes}`);
          if (!html.includes('function render()')) throw new Error('render() missing');
          if (!html.includes('function loadProviderState')) throw new Error('provider state loader missing');
          console.log('HTML structural checks passed');
          NODE
